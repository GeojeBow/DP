name: Check account sync

# Signs up a throwaway account with the public key only, writes one record to
# sync_records, reads it back, and checks another account can't see it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      URL: https://sxkembehrqovjmovagwy.supabase.co
      KEY: sb_publishable_eu98CP8qgSb6JHi3bOBZbA_XvGJWFU1
    steps:
      - run: |
          set -e
          signup() {
            curl -sS -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H 'Content-Type: application/json' \
              -d "{\"email\":\"sync-check-$1-$GITHUB_RUN_ID@example.com\",\"password\":\"check-$GITHUB_RUN_ID\"}"
          }
          a=$(signup a); echo "$a" | jq '{has_token: (.access_token != null), anonymous: .user.is_anonymous, error: .msg, code: .error_code}'
          ta=$(echo "$a" | jq -r .access_token)
          tb=$(signup b | jq -r .access_token)
          rest() { curl -sS -w '\nHTTP %{http_code}\n' "$URL/rest/v1/sync_records$2" -H "apikey: $KEY" -H "Authorization: Bearer $1" "${@:3}"; }
          echo '--- write'
          rest "$ta" '?on_conflict=user_id,kind,id' -X POST -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            -d "[{\"user_id\":\"$(echo "$a" | jq -r .user.id)\",\"kind\":\"trip\",\"id\":\"t1\",\"data\":{\"title\":\"check\"},\"deleted\":false,\"client_updated_at\":\"2026-01-01T00:00:00Z\"}]"
          echo '--- owner reads'
          rest "$ta" '?select=kind,id,data,updated_at'
          echo '--- other account reads (expect [])'
          rest "$tb" '?select=kind,id'
          echo '--- cleanup'
          rest "$ta" '?kind=eq.trip' -X DELETE
