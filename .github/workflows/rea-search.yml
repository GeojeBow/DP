name: REA Search

on:
  pull_request:
    paths: ['apps/rea-search/**', '.github/workflows/rea-search.yml']
  push:
    branches: [main]
    paths: ['apps/rea-search/**', '.github/workflows/rea-search.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/rea-search/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/rea-search/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      # Console build for the checks; the release build below has no console.
      - run: go build -trimpath -ldflags "-s -w" -o REASearch.exe .
      # Runners are administrators, so this exercises the NTFS MFT reader
      # and the change journal on a real Windows volume.
      - run: .\REASearch.exe -selftest
      - name: Web page answers
        shell: pwsh
        run: |
          $p = Start-Process .\REASearch.exe -ArgumentList '-no-browser','-elevated','-port','18777' -PassThru
          Start-Sleep 5
          $r = Invoke-WebRequest http://127.0.0.1:18777/ -UseBasicParsing
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'const TOKEN = "(\w+)"') { Stop-Process $p.Id; exit 1 }
          $h = @{ 'X-Token' = $Matches[1] }
          for ($i = 0; $i -lt 60; $i++) {
            $st = Invoke-RestMethod http://127.0.0.1:18777/api/status -Headers $h
            if ($st.mode -ne 'loading') { break }
            Start-Sleep 2
          }
          $s = Invoke-RestMethod 'http://127.0.0.1:18777/api/search?q=REASearch.exe&limit=5' -Headers $h
          Stop-Process $p.Id
          "status: $($st | ConvertTo-Json -Compress)"
          "found: $($s.total)"
          if ($s.total -lt 1) { exit 1 }
      - name: Release build
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o release\REASearch.exe .
      - name: Python version tests
        working-directory: apps/rea-search
        run: python -m unittest -v tests/test_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: REASearch
          path: apps/rea-search/go/release/REASearch.exe
