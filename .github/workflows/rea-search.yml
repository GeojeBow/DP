name: REA Search

on:
  pull_request:
    paths: ['apps/rea-search/**', '.github/workflows/rea-search.yml']
  push:
    branches: [main, rea-search]
    paths: ['apps/rea-search/**', '.github/workflows/rea-search.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/rea-search/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/rea-search/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      # Console build for the checks; the release build below has no console.
      - run: go build -trimpath -ldflags "-s -w" -o REASearch.exe .
      # Runners are administrators, so this exercises the NTFS MFT reader
      # and the change journal on a real Windows volume.
      - run: .\REASearch.exe -selftest
      - name: Web page answers
        shell: pwsh
        run: |
          $p = Start-Process .\REASearch.exe -ArgumentList '-no-browser','-elevated','-port','18777' -PassThru
          Start-Sleep 5
          $r = Invoke-WebRequest http://127.0.0.1:18777/ -UseBasicParsing
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'const TOKEN = "(\w+)"') { Stop-Process $p.Id; exit 1 }
          $h = @{ 'X-Token' = $Matches[1] }
          for ($i = 0; $i -lt 60; $i++) {
            $st = Invoke-RestMethod http://127.0.0.1:18777/api/status -Headers $h
            if ($st.mode -ne 'loading') { break }
            Start-Sleep 2
          }
          $s = Invoke-RestMethod 'http://127.0.0.1:18777/api/search?q=REASearch.exe&limit=5' -Headers $h
          $f = Invoke-RestMethod 'http://127.0.0.1:18777/api/facets?q=.dll' -Headers $h
          $u = Invoke-RestMethod "http://127.0.0.1:18777/api/search?q=.dll&limit=1&under=$($f.folder.folders[0].key)" -Headers $h
          $rep = Invoke-RestMethod http://127.0.0.1:18777/api/report -Headers $h
          $log = Invoke-RestMethod http://127.0.0.1:18777/api/log -Headers $h
          Stop-Process $p.Id
          "drives: $($rep.main.volumes | ConvertTo-Json -Compress)"
          "warnings: $($rep.warnings) errors: $($rep.errors)"
          $log | Where-Object { $_.level -ne 'info' } | ForEach-Object { "  [$($_.level)] $($_.msg)" }
          "status: $($st | ConvertTo-Json -Compress)"
          "found: $($s.total)"
          "facets for .dll: $(($f.folder.crumbs | ForEach-Object name) -join ' > ') | top: $($f.folder.folders[0].name) $($f.folder.folders[0].count) | narrowed: $($u.total)"
          if ($s.total -lt 1) { exit 1 }
          if ($u.total -ne $f.folder.folders[0].count) { exit 1 }
      - name: Release build
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o release\REASearch.exe .
      - name: Python version tests
        working-directory: apps/rea-search
        run: python -m unittest -v tests/test_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: REASearch
          path: apps/rea-search/go/release/REASearch.exe

  # A fixed download link for phones and other PCs:
  # https://github.com/GeojeBow/DP/releases/download/rea-search-latest/REASearch.zip
  # replaced on every push to the rea-search branch, after the checks pass.
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/rea-search'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/rea-search/README.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: REASearch
          path: dl
      - name: Make the zip
        run: |
          mkdir REASearch
          cp dl/REASearch.exe apps/rea-search/README.md REASearch/
          zip -r REASearch.zip REASearch
      - name: Replace the rea-search-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rea-search-latest --cleanup-tag --yes || true
          gh release create rea-search-latest REASearch.zip --prerelease --target "$GITHUB_SHA" \
            --title "REA Search 최신 빌드" \
            --notes "rea-search 브랜치 ${GITHUB_SHA::7} 빌드. REASearch.zip을 받아 압축을 풀고 REASearch.exe를 실행하세요. 사용법은 프로그램의 ? 버튼(F1)에 있습니다."
